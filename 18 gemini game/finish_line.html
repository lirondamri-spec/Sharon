<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <title>Celebration</title>
    <style>
        body { margin: 0; background: #000; overflow: hidden; display: flex; justify-content: center; align-items: center; min-height: 100vh; font-family: sans-serif; }
        .content { text-align: center; z-index: 10; color: white; padding: 20px; width: 100%; max-width: 400px; }
        
        /* Final Audio Box */
        .audio-container { background: rgba(255,255,255,0.1); border: 2px solid #db2777; border-radius: 25px; padding: 15px; margin: 30px 0; }
        audio { width: 100%; height: 45px; filter: invert(100%) hue-rotate(180deg) brightness(1.5); }

        h1 { font-size: 3em; font-weight: 900; filter: drop-shadow(0 0 15px #db2777); margin: 0; }
        .love { font-family: serif; font-style: italic; color: #f472b6; font-size: 1.4em; margin-top: 20px; }
    </style>
</head>
<body>
    <div class="content">
        <div style="font-size: 5em;">🥂</div>
        <h1>IT'S TIME.</h1>

        <div class="audio-container">
            <audio controls preload="auto">
                <source src="audio/finish_line.mp3" type="audio/mpeg">
            </audio>
        </div>

        <div class="love">Happy 18th Anniversary, Sharon.</div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
    <script>
        const run = () => {
            confetti({ particleCount: 150, spread: 70, origin: { y: 0.6 }, colors: ['#db2777', '#f472b6', '#ffffff'] });
        };
        run(); setInterval(run, 4000);
    </script>
</body>
</html>
