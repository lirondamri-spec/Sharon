<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>XVIII - Welcome</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background-color: #0f172a; height: 100vh; display: flex; justify-content: center; align-items: center; font-family: -apple-system, sans-serif; color: white; overflow: hidden; }
        
        .glass {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 40px;
            padding: 40px 25px;
            width: 90%;
            max-width: 380px;
            text-align: center;
        }

        h1 { 
            font-size: 3em; 
            font-weight: 900; 
            background: linear-gradient(to right, #f472b6, #db2777); 
            -webkit-background-clip: text; 
            -webkit-text-fill-color: transparent; 
            margin-bottom: 10px;
        }

        /* High-Visibility Audio Box */
        .audio-container {
            background: #1e293b;
            border: 2px dashed #f472b6;
            border-radius: 20px;
            padding: 20px 15px;
            margin: 25px 0;
        }

        audio {
            width: 100%;
            height: 45px;
            /* Inverts colors so the player is light/visible on dark background */
            filter: invert(100%) hue-rotate(180deg) brightness(1.5);
        }

        .btn {
            background: white;
            color: #0f172a;
            padding: 20px 0;
            width: 100%;
            border-radius: 100px;
            font-weight: 800;
            text-decoration: none;
            display: inline-block;
            font-size: 1.2em;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            transition: 0.3s;
        }
        .btn:active { transform: scale(0.95); }
    </style>
</head>
<body>

    <div class="glass">
        <div style="font-size: 4em; margin-bottom: 10px;">🌹</div>
        <h1>XVIII</h1>
        <p style="color: #94a3b8; line-height: 1.5; margin-bottom: 5px;">18 Years of Us.</p>

        <div class="audio-container">
            <p style="font-size: 0.85em; color: #f472b6; margin-bottom: 12px; font-weight: bold;">▶️ Click to hear Liron:</p>
            
            <audio controls preload="auto">
                <source src="audio/welcome.mp3" type="audio/mpeg">
                Your browser does not support the audio element.
            </audio>
        </div>

        <a href="stage1.html" class="btn" onclick="localStorage.clear()">Begin the Journey</a>
    </div>

</body>
</html>
