<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <title>VIII. Gift</title>
    <style>
        body { font-family: -apple-system, sans-serif; min-height: 100vh; display: flex; justify-content: center; align-items: center; background: #0f172a; margin: 0; color: white; }
        .container { width: 90%; max-width: 400px; text-align: center; }
        .audio-box { background: rgba(255,255,255,0.05); border: 1px dashed #f472b6; border-radius: 20px; padding: 20px; margin-bottom: 30px; }
        audio { width: 100%; height: 40px; }
        input { font-size: 50px; text-align: center; width: 140px; background: transparent; border: 2px solid #334155; border-radius: 25px; color: white; padding: 15px; margin: 20px 0; outline: none; }
        .btn { width: 100%; padding: 20px; border-radius: 100px; border: none; font-weight: bold; cursor: pointer; display: block; font-size: 1.1em; }
        #shareBtn { background: #25d366; color: white; margin-top: 10px; }
        #nextBtn { background: #db2777; color: white; display: none; margin-top: 15px; }
    </style>
</head>
<body>
    <div class="container">
        <h2 style="color: #f472b6; margin-bottom: 20px;">VIII. Request</h2>
        <div class="audio-box"><audio controls><source src="audio/stage_gift.mp3" type="audio/mpeg"></audio></div>
        <p style="color: #94a3b8;">Pick any emoji for a special wish tonight.</p>
        <input type="text" id="cust" placeholder="🎁" maxlength="2">
        <button id="shareBtn" class="btn" onclick="send()">Send Request 💕</button>
        <button id="nextBtn" class="btn" onclick="location.href='stage7.html'">Next Stage ➔</button>
    </div>
    <script>
        function send() {
            const e = document.getElementById('cust').value || '🎁';
            localStorage.setItem('stage_gift_choice', e);
            window.open(`https://wa.me/972584430097?text=${encodeURIComponent('💝 Request: ' + e)}`, '_blank');
            document.getElementById('shareBtn').style.display = 'none';
            document.getElementById('nextBtn').style.display = 'block';
        }
    </script>
</body>
</html>
